name: CI/CD

on:
  push:
    branches: [module-arch]
  pull_request:
    branches: [module-arch]

permissions:
  contents: read

concurrency:
  group: config-shop-${{ github.ref }}
  queue: max

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA" "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check Docker for integration tests
        run: docker info > /dev/null
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  test-web:
    name: Build web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  deploy-app:
    needs: [changes, test, test-web]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.changes.outputs.app == 'true' && needs.test.result == 'success' &&
      (needs.changes.outputs.web != 'true' || needs.test-web.result == 'success')
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: app
    secrets: inherit

  deploy-web:
    needs: [changes, test-web, deploy-app]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.changes.outputs.web == 'true' && needs.test-web.result == 'success' &&
      (needs.changes.outputs.app != 'true' || needs.deploy-app.result == 'success')
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: web
    secrets: inherit
