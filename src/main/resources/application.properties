spring.application.name=config-shop
spring.jpa.hibernate.ddl-auto=update
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
remnawave.webhook.secret=${REMNAWAVE_WEBHOOK_SECRET}
remnawave.squads.whitelist-uuid=${REMNAWAVE_WHITELIST_SQUAD_UUID}
remnawave.squads.traffic-limit-uuid=${REMNAWAVE_TRAFFIC_LIMIT_SQUAD_UUID}
remnawave.limit-grace-bytes=${REMNAWAVE_LIMIT_GRACE_BYTES:1000}
