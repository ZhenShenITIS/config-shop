spring.application.name=config-shop
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
payments.polling.interval=${PAYMENTS_POLLING_INTERVAL:30s}
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
remnawave.api-version=${REMNAWAVE_API_VERSION:2}
remnawave.webhook.secret=${REMNAWAVE_WEBHOOK_SECRET}
remnawave.squads.whitelist-uuid=${REMNAWAVE_WHITELIST_SQUAD_UUID}
remnawave.squads.traffic-limit-uuid=${REMNAWAVE_TRAFFIC_LIMIT_SQUAD_UUID}
remnawave.limit-grace-bytes=${REMNAWAVE_LIMIT_GRACE_BYTES:1000}
web.auth.jwt-secret-base64=${WEB_AUTH_JWT_SECRET_BASE64:}
web.auth.issuer=${WEB_AUTH_ISSUER:config-shop}
web.auth.audience=${WEB_AUTH_AUDIENCE:config-shop-web-api}
web.registration.confirmation-url=${WEB_AUTH_CONFIRMATION_URL:}
web.registration.mail-from=${WEB_AUTH_MAIL_FROM:}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS:true}
